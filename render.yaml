# Render Blueprint — FBI-NEXUS + PostgreSQL
#
# النشر بضغطة واحدة: Render Dashboard → New → Blueprint → اختر هذا المستودع → Apply.
# ينشئ هذا الملف خدمة الويب وقاعدة البيانات معًا، ويربط DATABASE_URL تلقائيًا
# (بدون نسخ روابط أو إدخال متغيرات يدويًا).
services:
  - type: web
    name: fbi-nexus
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fbi-nexus-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: fbi-nexus-db
    plan: free
    databaseName: fbi_nexus
    user: fbi_nexus
