# Render Blueprint — FBI-NEXUS + PostgreSQL
# Deploy: Render Dashboard → New → Blueprint → اختر هذا المستودع.
services:
  - type: web
    name: fbi-nexus
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fbi-nexus-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: fbi-nexus-db
    plan: free
    databaseName: fbi_nexus
    user: fbi_nexus
